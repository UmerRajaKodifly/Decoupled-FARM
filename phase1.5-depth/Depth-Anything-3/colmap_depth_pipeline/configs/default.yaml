render_type: perspective_non_overlapping
faces_per_frame: 4
hfov_deg: 90.0
vfov_deg: 90.0
num_steps_yaw: 4
pitches_deg: [0.0]

colmap_image: gcr.io/spatialsense/spatialsense-3dgs-job:3dgsbase1.5

# COLMAP = relative poses; DA3METRIC = dense depth (meters)
model_name: depth-anything/DA3METRIC-LARGE
window_size: 4
overlap: 1

scale_align:
  # Fit alpha: d_metric ≈ alpha * d_sparse  → scale COLMAP translations by alpha
  mode: global  # global | per_frame
  n_iters: 3
  thresh_mult: 2.0
  min_points: 20
  conf_mode: weight
  conf_percentile: 20.0
  conf_min: null

fusion:
  enabled: false
  seam_mode: conf_weight

# Make monocular face depths agree with shared COLMAP scaffolding
depth_agree:
  enabled: true
  per_face_scale: true   # s * d ≈ alpha * d_sparse per face
  sampling_number: 5000000

temporal_smooth:
  enabled: false
  window: 5

sparse_filter:
  min_track_length: 3
  max_reproj_error: 4.0

save_format: npy
process_res: 504
ref_view_strategy: saddle_balanced

# DA3METRIC sky head (DPT use_sky_head); mask sky in depths + PLY
sky_seg:
  enabled: true
  threshold: 0.3  # match DA3 compute_sky_mask / output_processor

video:
  extract_fps: 2.0
  max_frames: null
  jpeg_quality: 2
  frame_pattern: frame_%06d.jpg
